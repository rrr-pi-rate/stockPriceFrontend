<kirby-card hasPadding="true" style="background-color: white">
  <p class="label kirby-text-xsmall" style="font-weight: bold">{{ label() }}</p>
  <p class="value kirby-text-large">{{ value() }}</p>
  @if (sub()) {
    <p class="sub kirby-text-small" style="margin-top: -13px" [class]="tone()">{{ sub() }}</p>
  }
</kirby-card>
