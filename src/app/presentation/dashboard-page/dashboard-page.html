<kirby-loading-overlay [isLoading]="isLoading()">
  <div class="topbar">
    <div>
      <p class="eyebrow">Saxo · Nordnet · June</p>
      <h1>Portfolio Dashboard</h1>
    </div>
    <kirby-toggle [checked]="fakeData()" (checkedChange)="fakeData.set($event)" aria-label="Fake data"></kirby-toggle>
  </div>

  <div class="stats-grid">
    @for (card of cards(); track card. label) {
      <app-stat-card [label]="card.label" [value]="card.value" [sub]="card.sub" [tone]="card.tone"></app-stat-card>
    }
  </div>

  <kirby-card hasPadding="true">
    <app-period-selector [period]="period()" (periodChange)="period.set($event)"></app-period-selector>

    <div class="chart-toolbar">
      <kirby-toggle [checked]="benchmarkEnabled()" (checkedChange)="benchmarkEnabled.set($event)">
        Benchmark
      </kirby-toggle>
      <app-benchmark-picker [benchmark]="benchmark()" (benchmarkChange)="benchmark.set($event)"></app-benchmark-picker>

      <kirby-toggle [checked]="trendEnabled()" (checkedChange)="trendEnabled.set($event)">
        Trendlinje
      </kirby-toggle>

      <kirby-badge>{{ periodDescription(period()) }}</kirby-badge>
    </div>

    <app-portfolio-chart
      [entries]="overview()?.period.entries ?? []"
      [benchmarkLine]="overview()?.period.benchmarkLine ?? null"
      [trendLine]="overview()?.period.trendLine ?? null"></app-portfolio-chart>
  </kirby-card>
</kirby-loading-overlay>
