services:
  stock-price-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockPriceFrontend
    restart: unless-stopped
    environment:
      BACKEND_BASE_URL: http://192.168.1.239:5151
    ports:
      - "8081:80"

  caddy:
    image: caddy:2-alpine
    container_name: stockPriceCaddy
    restart: unless-stopped
    depends_on:
      - stock-price-frontend
    # Host-netværk, så Caddy ser den rigtige lokale IP på forbindelsen. Browsere sender ikke SNI
    # ved adgang via IP, og certifikatet vælges så ud fra destinations-adressen.
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
